<!DOCTYPE html>
<html>
<head>
  <title>GKA Flight Simulator v3</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #87CEEB;
    }
    canvas {
      display: block;
    }
  </style>
</head>

<body>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const planeImg = new Image();
planeImg.src = "plane.png";

// Plane physics
let plane = {
  x: canvas.width * 0.3,
  y: canvas.height * 0.5,
  vx: 0,
  vy: 0,
  angle: 0,
  throttle: 0.4
};

let gravity = 0.15;
let liftPower = 0.03;
let drag = 0.995;

let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// Clouds
let clouds = [];
for (let i = 0; i < 6; i++) {
  clouds.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height * 0.7,
    size: 150 + Math.random() * 150
  });
}

let runwayY = canvas.height - 120;

function update() {
  // Throttle
  if (keys["ArrowRight"]) plane.throttle += 0.002;
  if (keys["ArrowLeft"]) plane.throttle -= 0.002;
  plane.throttle = Math.max(0.1, Math.min(0.8, plane.throttle));

  // Pitch
  if (keys["ArrowUp"]) plane.angle -= 1.5;
  if (keys["ArrowDown"]) plane.angle += 1.5;
  plane.angle = Math.max(-25, Math.min(25, plane.angle));

  // Forward velocity from throttle
  plane.vx = Math.cos(plane.angle * Math.PI/180) * plane.throttle * 10;

  // Lift (based on speed + pitch)
  let lift = Math.sin(-plane.angle * Math.PI/180) * plane.throttle * 8;

  // Apply physics
  plane.vy += gravity - lift;
  plane.vy *= drag;
  plane.y += plane.vy;
  plane.x += plane.vx;

  // Wrap horizontally
  if (plane.x > canvas.width + 200) plane.x = -200;

  // Prevent going too high
  if (plane.y < 50) {
    plane.y = 50;
    plane.vy = 0;
  }

  // Landing
  if (plane.y + 40 >= runwayY) {
    if (Math.abs(plane.vy) < 2 && Math.abs(plane.angle) < 10) {
      alert("BUTTER LANDING 🧈");
    } else {
      alert("HARD LANDING 💥");
    }
    document.location.reload();
  }

  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Clouds
  ctx.fillStyle = "white";
  clouds.forEach(c => {
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.size * 0.4, 0, Math.PI * 2);
    ctx.arc(c.x + c.size * 0.3, c.y + 20, c.size * 0.35, 0, Math.PI * 2);
    ctx.arc(c.x - c.size * 0.3, c.y + 20, c.size * 0.35, 0, Math.PI * 2);
    ctx.fill();
    c.x -= 1;
    if (c.x < -200) c.x = canvas.width + 200;
  });

  // Runway
  ctx.fillStyle = "#444";
  ctx.fillRect(0, runwayY, canvas.width, 200);
  ctx.fillStyle = "white";
  for (let i = 0; i < canvas.width; i += 200) {
    ctx.fillRect(i, runwayY + 80, 100, 10);
  }

  // Plane
  ctx.save();
  ctx.translate(plane.x, plane.y);
  ctx.rotate(plane.angle * Math.PI / 180);
  ctx.drawImage(planeImg, -80, -40, 160, 80);
  ctx.restore();
}

update();
</script>
</body>
</html>
