<!DOCTYPE html>
<html>
<head>
    <title>GKA SkyRun — Flight Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Montserrat, sans-serif;
            background: linear-gradient(#87CEEB, #ffffff);
        }

        #gameArea {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #plane {
            position: absolute;
            width: 120px;
            left: 50px;
            top: 50%;
            transform: translateY(-50%);
            transition: transform 0.1s;
        }

        .cloud {
            position: absolute;
            width: 150px;
            opacity: 0.9;
        }

        #score {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #003366;
            text-shadow: 0 0 5px white;
        }
    </style>
</head>

<body>

<div id="gameArea">
    <img id="plane" src="plane.png">
    <div id="score">Score: 0</div>
</div>

<script>
    const plane = document.getElementById("plane");
    const gameArea = document.getElementById("gameArea");
    const scoreDisplay = document.getElementById("score");

    let planeY = window.innerHeight / 2;
    let score = 0;

    // Move plane with arrow keys
    document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowUp") planeY -= 30;
        if (e.key === "ArrowDown") planeY += 30;
        plane.style.top = planeY + "px";
    });

    // Spawn clouds
    function spawnCloud() {
        const cloud = document.createElement("img");
        cloud.src = "cloud.png";
        cloud.classList.add("cloud");

        cloud.style.top = Math.random() * (window.innerHeight - 150) + "px";
        cloud.style.left = window.innerWidth + "px";

        gameArea.appendChild(cloud);

        let cloudX = window.innerWidth;

        const move = setInterval(() => {
            cloudX -= 5;
            cloud.style.left = cloudX + "px";

            // Collision detection
            const planeRect = plane.getBoundingClientRect();
            const cloudRect = cloud.getBoundingClientRect();

            if (
                planeRect.left < cloudRect.right &&
                planeRect.right > cloudRect.left &&
                planeRect.top < cloudRect.bottom &&
                planeRect.bottom > cloudRect.top
            ) {
                alert("Game Over! Final Score: " + score);
                window.location.reload();
            }

            // Remove cloud when off screen
            if (cloudX < -200) {
                cloud.remove();
                score++;
                scoreDisplay.textContent = "Score: " + score;
                clearInterval(move);
            }
        }, 20);
    }

    setInterval(spawnCloud, 1500);
</script>

</body>
</html>
