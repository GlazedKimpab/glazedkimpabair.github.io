<!DOCTYPE html>
<html>
<head>
    <title>GlazedKimpabAir — Official Airline Website</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Fade-in animation for whole page */
    body {
        margin: 0;
        font-family: Montserrat, sans-serif;
        background-color: #f4f4f4;
        animation: fadeIn 1.2s ease-in-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    /* Navbar animation */
    .navbar {
        background-color: #003366;
        padding: 15px;
        color: white;
        font-size: 20px;
        animation: dropDown 0.8s ease-out;
    }

    @keyframes dropDown {
        from {
            opacity: 0;
            transform: translateY(-20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .navbar a {
        color: white;
        margin-right: 20px;
        text-decoration: none;
        font-weight: bold;
    }

    /* Hero animation */
    .hero {
        background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Airplane_sky.jpg/1920px-Airplane_sky.jpg');
        background-size: cover;
        background-position: center;
        height: 350px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 40px;
        font-weight: bold;
        text-shadow: 0px 0px 10px black;
        animation: slideUp 1.3s ease-out;
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(40px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .section {
        padding: 40px;
        text-align: center;
        animation: fadeIn 1.8s ease-in-out;
    }
</style>    
</head>

<body>

    <div class="navbar">
        GlazedKimpabAir
        <a href="index.html">Home</a>
        <a href="fleet.html">Fleet</a>
        <a href="#">Destinations</a>
        <a href="#">About Us</a>
    </div>

    <div class="hero">
        Fly the Future
    </div>

    <div class="section">
        <h2>Welcome to GlazedKimpabAir</h2>
        <p>Experience comfort, innovation, and Korean hospitality in the skies.</p>
    </div>

</body>
</html>
