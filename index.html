<!DOCTYPE html>
<html>
<head>
    <title>GlazedKimpabAir — Official Airline Website</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        /* Fade-in animation */
        body {
            animation: fadeIn 1.2s ease-in-out;
            margin: 0;
            font-family: Montserrat, sans-serif;
            background-color: #f4f4f4;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Navbar */
        .navbar {
            background-color: #003366;
            padding: 15px;
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
        }

        .navbar a {
            color: white;
            margin-right: 20px;
            text-decoration: none;
            font-weight: bold;
        }

        /* Logo styling */
        .logo {
            height: 45px;
            vertical-align: middle;
            margin-right: 25px;
            transition: 0.3s ease;
        }

        .logo:hover {
            filter: drop-shadow(0 0 8px rgba(0, 180, 255, 0.8));
            transform: scale(1.05);
        }

        /* Hero section */
        .hero {
            background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Airplane_sky.jpg/1920px-Airplane_sky.jpg');
            background-size: cover;
            background-position: center;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
            font-weight: bold;
            text-shadow: 0px 0px 10px black;
        }

        .section {
            padding: 40px;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- ⭐ Updated Navbar with Your Logo -->
    <div class="navbar">
        <a href="index.html">
            <img src="GlazedKimpabAir-removebg-preview-removebg-preview.png" 
                 class="logo" 
                 alt="GlazedKimpabAir Logo">
        </a>
        <a href="index.html">Home</a>
        <a href="fleet.html">Fleet</a>
        <a href="#">Destinations</a>
        <a href="#">About Us</a>
    </div>

    <div class="hero">
        Fly the Future
    </div>

    <div class="section">
        <h2>Welcome to GlazedKimpabAir</h2>
        <p>Experience comfort, innovation, and Korean hospitality in the skies.</p>
    </div>

</body>
</html>
