<!DOCTYPE html>
<html>
<head>
    <title>GlazedKimpabAir — Official Airline Website</title>
    <link rel="icon" type="image/png" href="Screenshot_2026-04-15_212708-removebg-preview.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        /* Fade-in animation */
        body {
            animation: fadeIn 1.2s ease-in-out;
            margin: 0;
            font-family: Montserrat, sans-serif;
            background-color: #f4f4f4;
            transition: background 0.3s, color 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Navbar */
        .navbar {
            background-color: #003366;
            padding: 15px;
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
            position: relative;
            z-index: 9999;
        }

        .navbar a {
            color: white;
            margin-right: 20px;
            text-decoration: none;
            font-weight: bold;
        }

        /* Dark Mode Button */
        #darkToggle {
            margin-left: auto;
            padding: 8px 14px;
            background: #0055aa;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        #darkToggle:hover {
            background: #0077dd;
        }

        /* Logo styling */
        .logo {
            height: 45px;
            vertical-align: middle;
            margin-right: 25px;
            transition: 0.3s ease;
        }

        .logo:hover {
            filter: drop-shadow(0 0 8px rgba(0, 180, 255, 0.8));
            transform: scale(1.05);
        }

        /* VIDEO HERO SECTION */
        .video-container {
            position: relative;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* Dark overlay */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.35);
            z-index: 1;
        }

        .overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 2;
            text-shadow: 0 0 20px rgba(0,0,0,0.7);
        }

        .overlay-text h1 {
            font-size: 60px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .overlay-text p {
            font-size: 22px;
            font-weight: 500;
        }

        /* Section below video */
        .section {
            padding: 40px;
            text-align: center;
        }

        /* 🌙 DARK MODE THEME */
        .dark-mode {
            background-color: #0d1117;
            color: #e6e6e6;
        }

        .dark-mode .navbar {
            background-color: #111827;
        }

        .dark-mode .section h2,
        .dark-mode .section p {
            color: #e6e6e6;
        }

        .dark-mode .overlay-text {
            text-shadow: 0 0 25px rgba(0, 200, 255, 0.8);
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <a href="index.html">
            <img src="GlazedKimpabAir-removebg-preview-removebg-preview.png"
                 class="logo"
                 alt="GlazedKimpabAir Logo">
        </a>
        <a href="index.html">Home</a>
        <a href="fleet.html">Fleet</a>
        <a href="destinations.html">Destinations</a>
        <a href="about.html">About Us</a>

        <!-- Dark Mode Button -->
        <button id="darkToggle">Dark Mode</button>
    </div>

    <!-- VIDEO HERO -->
    <div class="video-container">
        <video autoplay muted loop playsinline>
            <source src="gka747200_a17kitwK.mp4" type="video/mp4">
        </video>

        <div class="video-overlay"></div>

        <div class="overlay-text">
            <h1>Fly the Future</h1>
            <p>Welcome to GlazedKimpabAir</p>
            <p>Experience comfort, innovation, and Korean hospitality in the skies.</p>
        </div>
    </div>

    <div class="section">
        <h2>Welcome to GlazedKimpabAir</h2>
        <p>Experience comfort, innovation, and Korean hospitality in the skies.</p>
    </div>

    <!-- 🌙 DARK MODE SCRIPT -->
    <script>
        document.getElementById("darkToggle").onclick = function () {
            document.body.classList.toggle("dark-mode");
        };
    </script>

</body>
</html>
