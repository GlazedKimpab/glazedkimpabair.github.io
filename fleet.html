<!DOCTYPE html>
<html>
<head>
    <title>GlazedKimpabAir Fleet</title>
    <link rel="icon" type="image/png" href="Screenshot_2026-04-15_212708-removebg-preview.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #f4f4f4;
            animation: fadeIn 1.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Navbar */
        .navbar {
            background-color: #003366;
            padding: 15px;
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
            animation: dropDown 0.8s ease-out;
            position: relative;
            z-index: 9999; /* ⭐ FIXED */
        }

        @keyframes dropDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .navbar a {
            color: white;
            margin-right: 20px;
            text-decoration: none;
            font-weight: 600;
        }

        /* Airline Logo */
        .logo {
            height: 45px;
            margin-right: 25px;
            transition: 0.3s ease;
        }

        .logo:hover {
            filter: drop-shadow(0 0 8px rgba(0, 180, 255, 0.8));
            transform: scale(1.05);
        }

        /* Manufacturer Logos */
        .brand-logo {
            display: block;
            margin: 0 auto 10px auto;
            max-height: 45px;
            width: auto;
            object-fit: contain;
            opacity: 0.9;
            transition: 0.3s ease;
        }

        .brand-logo:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        /* Header */
        .header {
            text-align: center;
            padding: 40px;
            font-size: 40px;
            font-weight: 700;
            animation: slideUp 1s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Fleet Grid */
        .fleet-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            padding: 20px;
            width: 90%;
            margin: auto;
            z-index: 0; /* ⭐ FIXED */
            position: relative;
        }

        .card-link {
            text-decoration: none;
            color: inherit;
        }

        .plane-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 10px #ccc;
            text-align: center;
            transition: transform 0.15s ease-out, box-shadow 0.2s ease;
            animation: popIn 0.6s ease-out;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }

        .plane-card img:not(.brand-logo) {
            width: 100%;
            border-radius: 10px;
            margin-top: 8px;
            transition: transform 0.3s ease;
        }

        .plane-card:hover img:not(.brand-logo) {
            transform: scale(1.05);
        }

        .plane-extra {
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: opacity 0.3s ease, max-height 0.3s ease;
            font-size: 14px;
            color: #555;
            margin-top: 10px;
        }

        .plane-card:hover {
            box-shadow: 0 0 20px #bbb;
            transform: scale(1.05);
        }

        .plane-card:hover .plane-extra {
            opacity: 1;
            max-height: 200px;
        }

        .plane-title {
            font-size: 24px;
            font-weight: 700;
            margin-top: 15px;
        }

        .plane-info {
            font-size: 15px;
            margin-top: 10px;
            color: #333;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <a href="index.html">
            <img src="GlazedKimpabAir-removebg-preview-removebg-preview.png" class="logo">
        </a>
        <a href="index.html">Home</a>
        <a href="fleet.html">Fleet</a>
        <a href="destinations.html">Destinations</a>
        <a href="about.html">About Us</a>
    </div>

    <div class="header">Our Fleet</div>

    <div class="fleet-container">
        <!-- your fleet cards unchanged -->

</body>
</html>
